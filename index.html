<script>
/* =========================================================
   1. CONFIG & BASE STATES
   ========================================================= */
const CATEGORIES = [
  { key:"wissen",   icon:"🧠", xp:20, coins:10 },
  { key:"gaming",   icon:"🎮", xp:20, coins:10 },
  { key:"facts",    icon:"🌍", xp:25, coins:15 },
  { key:"reaktion", icon:"⚡", xp:25, coins:15 },
  { key:"logik",    icon:"🧩", xp:30, coins:20 }
];

const TRANSLATIONS = {
  de: { correct:"Richtig!", wrong:"Falsch!" },
  en: { correct:"Correct!", wrong:"Wrong!" },
  ru: { correct:"Верно!", wrong:"Неверно!" }
};

const FALLBACK_QUESTIONS = {
  wissen: [{ q:"Wie viele Kontinente gibt es?", a:["5","6","7","8"], c:2 }],
  gaming: [{ q:"Welche Plattform gehört zu Valve?", a:["Steam","Epic Games","Roblox","Discord"], c:0 }],
  facts: [{ q:"Wie viele Herzen hat ein Oktopus?", a:["1","2","3","4"], c:2 }],
  reaktion: [{ q:"Welche Ampelfarbe bedeutet 'Stopp'?", a:["Grün","Gelb","Rot","Blau"], c:2 }],
  logik: [{ q:"Was folgt in der Reihe: 2, 4, 8, 16, ?", a:["18","24","32","20"], c:2 }]
};

let currentLang = "de";
let currentQuestionBank = FALLBACK_QUESTIONS;

let user = { xp: 0, level: 1, coins: 0, streak: 0, lastPlayedDate: null };
let daily = { date: todayStr(), challenges: [] };

/* =========================================================
   2. HELPER FUNCTIONS
   ========================================================= */
function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function seededIndex(seedStr, max) {
  let hash = 0;
  for (let i = 0; i < seedStr.length; i++) {
    hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
  }
  return Math.abs(hash) % max;
}

function loadAll() {
  try {
    const u = localStorage.getItem("dz_user");
    if (u) user = JSON.parse(u);
    const d = localStorage.getItem("dz_daily");
    if (d) {
      const parsed = JSON.parse(d);
      if (parsed.date === todayStr()) daily = parsed;
    }
  } catch(e) { console.error("Fehler beim Laden aus Speicher:", e); }
}

function saveAll() {
  localStorage.setItem("dz_user", JSON.stringify(user));
  localStorage.setItem("dz_daily", JSON.stringify(daily));
}

/* =========================================================
   3. DYNAMIC JSON LOADING
   ========================================================= */
async function loadLanguageQuestions(langCode) {
  try {
    const res = await fetch(`questions/${langCode}.json`);
    if (res.ok) {
      currentQuestionBank = await res.json();
    } else {
      currentQuestionBank = FALLBACK_QUESTIONS;
    }
  } catch(e) {
    currentQuestionBank = FALLBACK_QUESTIONS;
  }

  daily.date = todayStr();
  daily.challenges = generateDailyChallenges(todayStr());
  saveAll();
  renderAll();
}

function generateDailyChallenges(dateStr) {
  return CATEGORIES.map(cat => {
    const bank = currentQuestionBank[cat.key] || FALLBACK_QUESTIONS[cat.key] || FALLBACK_QUESTIONS.wissen;
    const idx = seededIndex(dateStr + "_" + cat.key, bank.length);
    const item = bank[idx] || bank[0];
    
    return {
      category: cat.key,
      catIcon: cat.icon,
      question: item.q,
      answers: item.a,
      correctIndex: item.c,
      xp: cat.xp,
      coins: cat.coins,
      completed: false,
      wasCorrect: null
    };
  });
}

function answerQuestion(catIndex, selectedIdx) {
  const ch = daily.challenges[catIndex];
  if (!ch || ch.completed) return;

  ch.completed = true;
  if (selectedIdx === ch.correctIndex) {
    ch.wasCorrect = true;
    user.xp += ch.xp;
    user.coins += ch.coins;
  } else {
    ch.wasCorrect = false;
  }

  saveAll();
  renderAll();
}

/* =========================================================
   4. RENDER UI (MIT ABFANG-SCHUTZ)
   ========================================================= */
function renderAll() {
  const t = TRANSLATIONS[currentLang] || TRANSLATIONS.de;

  // Safe Updates für Stats
  const elLvl = document.getElementById("val-level");
  if (elLvl) elLvl.innerText = user.level;
  
  const elXp = document.getElementById("val-xp");
  if (elXp) elXp.innerText = user.xp;

  const elCoins = document.getElementById("val-coins");
  if (elCoins) elCoins.innerText = user.coins;

  const elStreak = document.getElementById("val-streak");
  if (elStreak) elStreak.innerText = user.streak;

  // Container für Fragen
  const container = document.getElementById("challenges-list");
  if (!container) return;
  container.innerHTML = "";

  daily.challenges.forEach((ch, idx) => {
    const card = document.createElement("div");
    card.className = "card";

    let html = `<h3>${ch.catIcon} ${ch.category.toUpperCase()}</h3><p><strong>${ch.question}</strong></p>`;

    if (ch.completed) {
      const statusText = ch.wasCorrect ? `✅ ${t.correct}` : `❌ ${t.wrong}`;
      html += `<p>${statusText}</p>`;
    } else {
      html += `<div class="answers">`;
      ch.answers.forEach((ans, aIdx) => {
        html += `<button onclick="answerQuestion(${idx}, ${aIdx})" style="margin: 4px; padding: 8px;">${ans}</button>`;
      });
      html += `</div>`;
    }

    card.innerHTML = html;
    container.appendChild(card);
  });
}

/* =========================================================
   5. INIT
   ========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  loadAll();

  const langSelect = document.getElementById("lang-select");
  if (langSelect) {
    langSelect.addEventListener("change", (e) => {
      currentLang = e.target.value;
      loadLanguageQuestions(currentLang);
    });
  }

  loadLanguageQuestions(currentLang);
});
</script>
