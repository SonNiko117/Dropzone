<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropzone Daily</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
    .stat-label { font-size: 0.75rem; color: var(--text-dim); }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h3 { margin-top: 0; font-size: 1rem; color: var(--accent); }
    .answers { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    button {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
    }
    button:hover { background: var(--accent); }
    .status { font-weight: bold; margin-top: 8px; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Dropzone Daily</h1>
    <select id="lang-select">
      <option value="de">DE 🇩🇪</option>
      <option value="en">EN 🇬🇧</option>
      <option value="ru">RU 🇷🇺</option>
    </select>
  </header>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-value" id="val-level">1</div><div class="stat-label">LVL</div></div>
    <div class="stat-card"><div class="stat-value" id="val-xp">0</div><div class="stat-label">XP</div></div>
    <div class="stat-card"><div class="stat-value" id="val-coins">0</div><div class="stat-label">COINS</div></div>
    <div class="stat-card"><div class="stat-value" id="val-streak">0</div><div class="stat-label">STREAK</div></div>
  </div>

  <div id="challenges-list"></div>
</div>

<script>
const CATEGORIES = [
  { key:"wissen",   icon:"🧠", xp:20, coins:10 },
  { key:"gaming",   icon:"🎮", xp:20, coins:10 },
  { key:"facts",    icon:"🌍", xp:25, coins:15 },
  { key:"reaktion", icon:"⚡", xp:25, coins:15 },
  { key:"logik",    icon:"🧩", xp:30, coins:20 }
];

const TRANSLATIONS = {
  de: { correct:"Richtig!", wrong:"Falsch!" },
  en: { correct:"Correct!", wrong:"Wrong!" },
  ru: { correct:"Верно!", wrong:"Неверно!" }
};

const FALLBACK_QUESTIONS = {
  wissen: [{ q:"Wie viele Kontinente gibt es?", a:["5","6","7","8"], c:2 }],
  gaming: [{ q:"Welche Plattform gehört zu Valve?", a:["Steam","Epic Games","Roblox","Discord"], c:0 }],
  facts: [{ q:"Wie viele Herzen hat ein Oktopus?", a:["1","2","3","4"], c:2 }],
  reaktion: [{ q:"Welche Ampelfarbe bedeutet 'Stopp'?", a:["Grün","Gelb","Rot","Blau"], c:2 }],
  logik: [{ q:"Was folgt in der Reihe: 2, 4, 8, 16, ?", a:["18","24","32","20"], c:2 }]
};

let currentLang = "de";
let currentQuestionBank = FALLBACK_QUESTIONS;
let user = { xp: 0, level: 1, coins: 0, streak: 0, lastPlayedDate: null };
let daily = { date: todayStr(), challenges: [] };

function todayStr() { return new Date().toISOString().split('T')[0]; }

function seededIndex(seedStr, max) {
  let hash = 0;
  for (let i = 0; i < seedStr.length; i++) hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
  return Math.abs(hash) % max;
}

function loadAll() {
  try {
    const u = localStorage.getItem("dz_user");
    if (u) user = JSON.parse(u);
    const d = localStorage.getItem("dz_daily");
    if (d) {
      const parsed = JSON.parse(d);
      if (parsed.date === todayStr()) daily = parsed;
    }
  } catch(e) {}
}

function saveAll() {
  localStorage.setItem("dz_user", JSON.stringify(user));
  localStorage.setItem("dz_daily", JSON.stringify(daily));
}

async function loadLanguageQuestions(langCode) {
  try {
    const res = await fetch(`questions/${langCode}.json`);
    if (res.ok) {
      currentQuestionBank = await res.json();
    } else {
      currentQuestionBank = FALLBACK_QUESTIONS;
    }
  } catch(e) {
    currentQuestionBank = FALLBACK_QUESTIONS;
  }

  daily.date = todayStr();
  daily.challenges = generateDailyChallenges(todayStr());
  saveAll();
  renderAll();
}

function generateDailyChallenges(dateStr) {
  return CATEGORIES.map(cat => {
    const bank = currentQuestionBank[cat.key] || FALLBACK_QUESTIONS[cat.key] || FALLBACK_QUESTIONS.wissen;
    const idx = seededIndex(dateStr + "_" + cat.key, bank.length);
    const item = bank[idx] || bank[0];
    return {
      category: cat.key,
      catIcon: cat.icon,
      question: item.q,
      answers: item.a,
      correctIndex: item.c,
      xp: cat.xp,
      coins: cat.coins,
      completed: false,
      wasCorrect: null
    };
  });
}

function answerQuestion(catIndex, selectedIdx) {
  const ch = daily.challenges[catIndex];
  if (!ch || ch.completed) return;

  ch.completed = true;
  if (selectedIdx === ch.correctIndex) {
    ch.wasCorrect = true;
    user.xp += ch.xp;
    user.coins += ch.coins;
  } else {
    ch.wasCorrect = false;
  }

  saveAll();
  renderAll();
}

function renderAll() {
  const t = TRANSLATIONS[currentLang] || TRANSLATIONS.de;

  document.getElementById("val-level").innerText = user.level;
  document.getElementById("val-xp").innerText = user.xp;
  document.getElementById("val-coins").innerText = user.coins;
  document.getElementById("val-streak").innerText = user.streak;

  const container = document.getElementById("challenges-list");
  if (!container) return;
  container.innerHTML = "";

  daily.challenges.forEach((ch, idx) => {
    const card = document.createElement("div");
    card.className = "card";

    let html = `<h3>${ch.catIcon} ${ch.category.toUpperCase()}</h3><p><strong>${ch.question}</strong></p>`;

    if (ch.completed) {
      const statusText = ch.wasCorrect ? `✅ ${t.correct}` : `❌ ${t.wrong}`;
      html += `<p class="status">${statusText}</p>`;
    } else {
      html += `<div class="answers">`;
      ch.answers.forEach((ans, aIdx) => {
        html += `<button onclick="answerQuestion(${idx}, ${aIdx})">${ans}</button>`;
      });
      html += `</div>`;
    }

    card.innerHTML = html;
    container.appendChild(card);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  loadAll();

  const langSelect = document.getElementById("lang-select");
  if (langSelect) {
    langSelect.addEventListener("change", (e) => {
      currentLang = e.target.value;
      loadLanguageQuestions(currentLang);
    });
  }

  loadLanguageQuestions(currentLang);
});
</script>

</body>
</html>
