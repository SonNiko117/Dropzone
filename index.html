<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DROPZONE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0a0c10;
    --bg-elevated:#0f1216;
    --card:#181c22;
    --card-2:#1f242b;
    --card-hover:#242a32;
    --accent:#3aa3ff;
    --accent-2:#2b8ee0;
    --accent-dim:rgba(58,163,255,0.14);
    --text:#f4f6f8;
    --text-secondary:#8b93a1;
    --text-tertiary:#5a626f;
    --success:#33c26f;
    --success-dim:rgba(51,194,111,0.14);
    --danger:#ff5b5b;
    --danger-dim:rgba(255,91,91,0.14);
    --gold:#f7c948;
    --silver:#c7cdd6;
    --bronze:#d1854a;
    --radius-xl:26px;
    --radius-lg:20px;
    --radius-md:16px;
    --radius-sm:12px;
    --nav-h:70px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 14px);
    position:relative;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 6px 18px;
  }
  .topbar-user{ display:flex; align-items:center; gap:10px; }
  .avatar-sm{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(145deg,var(--accent),#6a5bff);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; color:#fff; flex-shrink:0;
  }
  .topbar-name{ font-size:14px; font-weight:600; line-height:1.1; }
  .topbar-sub{ font-size:12px; color:var(--text-secondary); margin-top:1px; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .topbar-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--card);
    padding:8px 12px; border-radius:100px;
    font-size:13px; font-weight:600;
  }
  .lang-select{
    background:var(--card);
    color:var(--text);
    border:1px solid rgba(255,255,255,0.08);
    padding:6px 10px;
    border-radius:100px;
    font-size:12px;
    font-weight:700;
    outline:none;
    cursor:pointer;
  }
  main.view{ padding:10px 16px 4px 16px; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  h1,h2,h3,p{ margin:0; }
  .section-title{
    font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--text-secondary); margin:22px 4px 10px 4px;
  }
  .section-title:first-child{ margin-top:6px; }

  /* Daily header card */
  .daily-card{
    background:linear-gradient(155deg, var(--card-2), var(--card));
    border-radius:var(--radius-xl);
    padding:18px 20px;
    border:1px solid rgba(255,255,255,0.04);
  }
  .daily-card-top{ display:flex; align-items:center; justify-content:space-between; }
  .daily-card-title{ font-size:15px; font-weight:800; letter-spacing:0.03em; }
  .daily-card-count{ font-size:14px; font-weight:700; color:var(--accent); }
  .progress-track{
    margin-top:12px; height:10px; background:var(--bg-elevated);
    border-radius:100px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent));
    border-radius:100px; transition:width .4s ease;
  }

  /* Bonus card */
  .bonus-card{
    margin-top:14px; border-radius:var(--radius-lg);
    padding:16px 18px; display:flex; align-items:center; gap:12px;
    background:linear-gradient(120deg, rgba(247,201,72,0.16), rgba(247,201,72,0.05));
    border:1px solid rgba(247,201,72,0.35);
  }
  .bonus-card.claimed{
    background:var(--card); border:1px solid rgba(255,255,255,0.04); opacity:0.7;
  }
  .bonus-icon{ font-size:26px; }
  .bonus-texts{ flex:1; }
  .bonus-title{ font-size:14px; font-weight:800; }
  .bonus-sub{ font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .bonus-btn{
    background:var(--gold); color:#221a04; border:none; font-weight:800;
    font-size:12px; padding:9px 14px; border-radius:100px; cursor:pointer;
  }
  .bonus-btn:disabled{ background:var(--card-2); color:var(--text-tertiary); }

  /* Challenge cards */
  .challenge-card{
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:14px 16px;
    margin-top:12px;
    border:1px solid rgba(255,255,255,0.04);
    transition:background .15s ease;
  }
  .challenge-card.done{ opacity:0.55; }
  .challenge-head{
    display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  .challenge-icon{
    width:42px; height:42px; border-radius:var(--radius-sm);
    background:var(--accent-dim); display:flex; align-items:center; justify-content:center;
    font-size:19px; flex-shrink:0;
  }
  .challenge-icon.done{ background:var(--success-dim); }
  .challenge-info{ flex:1; min-width:0; }
  .challenge-cat{ font-size:11px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em;}
  .challenge-q{ font-size:14px; font-weight:600; margin-top:2px; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .challenge-reward{ font-size:11px; color:var(--text-secondary); margin-top:5px; white-space:nowrap;}
  .challenge-chevron{ font-size:13px; color:var(--text-tertiary); flex-shrink:0; transition:transform .2s ease;}
  .challenge-chevron.open{ transform:rotate(90deg); }
  .challenge-check{ font-size:18px; flex-shrink:0; }

  .answers{
    margin-top:14px; display:flex; flex-direction:column; gap:8px;
    max-height:0; overflow:hidden; transition:max-height .3s ease;
  }
  .answers.open{ max-height:500px; }
  .answer-btn{
    background:var(--card-2); border:1px solid rgba(255,255,255,0.05);
    color:var(--text); text-align:left; padding:12px 14px; border-radius:var(--radius-md);
    font-size:13.5px; font-weight:500; cursor:pointer;
  }
  .answer-btn:active{ background:var(--card-hover); }

  /* Mini stats */
  .mini-stats{ display:flex; gap:10px; margin-top:14px; }
  .mini-stat{
    flex:1; background:var(--card); border-radius:var(--radius-md);
    padding:12px; text-align:center;
  }
  .mini-stat-val{ font-size:16px; font-weight:800; }
  .mini-stat-label{ font-size:10.5px; color:var(--text-secondary); margin-top:2px; text-transform:uppercase; letter-spacing:0.04em;}

  /* Ranking */
  .rank-note{
    font-size:11.5px; color:var(--text-tertiary); background:var(--card);
    padding:8px 12px; border-radius:var(--radius-sm); margin-bottom:14px;
  }
  .rank-row{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border-radius:var(--radius-lg);
    padding:12px 14px; margin-bottom:10px;
    border:1px solid rgba(255,255,255,0.04);
  }
  .rank-row.me{
    background:linear-gradient(120deg, var(--accent-dim), rgba(58,163,255,0.03));
    border:1px solid rgba(58,163,255,0.4);
  }
  .rank-pos{ width:30px; text-align:center; font-size:16px; font-weight:800; color:var(--text-secondary); flex-shrink:0;}
  .rank-medal{ font-size:20px; }
  .rank-avatar{
    width:36px; height:36px; border-radius:50%;
    background:var(--card-2); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex-shrink:0;
  }
  .rank-info{ flex:1; min-width:0; }
  .rank-name{ font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:1px;}
  .rank-xp{ font-size:13px; font-weight:700; color:var(--text-secondary); flex-shrink:0;}
  .rank-row.me .rank-xp{ color:var(--accent); }

  /* Profile */
  .profile-header{ display:flex; flex-direction:column; align-items:center; padding:20px 0 6px 0; text-align:center;}
  .avatar-lg{
    width:84px; height:84px; border-radius:50%;
    background:linear-gradient(145deg,var(--accent),#6a5bff);
    display:flex; align-items:center; justify-content:center;
    font-size:32px; font-weight:800; color:#fff;
  }
  .profile-name{ font-size:19px; font-weight:800; margin-top:12px; }
  .profile-level{ font-size:12.5px; color:var(--accent); font-weight:700; margin-top:3px; letter-spacing:0.03em;}
  .xp-box{ width:100%; margin-top:14px; }
  .xp-box-top{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:6px;}

  .stat-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px;
  }
  .stat-tile{
    background:var(--card); border-radius:var(--radius-md);
    padding:12px 6px; text-align:center;
  }
  .stat-tile-icon{ font-size:17px; }
  .stat-tile-val{ font-size:14px; font-weight:800; margin-top:4px; }
  .stat-tile-label{ font-size:9.5px; color:var(--text-secondary); margin-top:1px; text-transform:uppercase; letter-spacing:0.03em;}

  .badge-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  }
  .badge-tile{
    background:var(--card); border-radius:var(--radius-lg);
    padding:14px 8px; text-align:center;
    border:1px solid rgba(255,255,255,0.04);
  }
  .badge-tile.locked{ opacity:0.35; filter:grayscale(1); }
  .badge-icon{ font-size:26px; }
  .badge-title{ font-size:11px; font-weight:700; margin-top:6px; line-height:1.25;}
  .badge-desc{ font-size:9.5px; color:var(--text-secondary); margin-top:2px; line-height:1.25;}

  .playerstats-list{
    background:var(--card); border-radius:var(--radius-lg); overflow:hidden;
  }
  .playerstats-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 16px; font-size:13.5px;
    border-bottom:1px solid rgba(255,255,255,0.04);
  }
  .playerstats-row:last-child{ border-bottom:none; }
  .playerstats-label{ color:var(--text-secondary); }
  .playerstats-val{ font-weight:700; }

  /* Bottom nav */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    padding-bottom:var(--safe-bottom);
    background:linear-gradient(0deg, rgba(10,12,16,1) 60%, rgba(10,12,16,0.85));
    backdrop-filter:blur(14px);
    z-index:50;
  }
  .bottom-nav-inner{
    max-width:560px; width:100%;
    display:flex; height:var(--nav-h);
    border-top:1px solid rgba(255,255,255,0.06);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; background:none; border:none; color:var(--text-tertiary);
    font-size:10.5px; font-weight:700; cursor:pointer; letter-spacing:0.02em;
  }
  .nav-btn .nav-icon{ font-size:21px; opacity:0.55; transition:opacity .15s ease, transform .15s ease; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn.active .nav-icon{ opacity:1; transform:translateY(-1px); }

  /* Toast */
  #toast-wrap{
    position:fixed; top:14px; left:0; right:0; display:flex; justify-content:center;
    z-index:100; pointer-events:none;
  }
  .toast{
    background:var(--card-2); border:1px solid rgba(255,255,255,0.08);
    padding:10px 18px; border-radius:100px; font-size:13px; font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    animation:toastIn .25s ease, toastOut .25s ease 1.8s forwards;
  }
  @keyframes toastIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toastOut{ from{opacity:1;} to{opacity:0; transform:translateY(-8px);} }
</style>
</head>
<body>

<div id="toast-wrap"></div>

<div id="app">
  <div class="topbar">
    <div class="topbar-user">
      <div class="avatar-sm" id="topbar-avatar">?</div>
      <div>
        <div class="topbar-name" id="topbar-name">Spieler</div>
        <div class="topbar-sub" id="topbar-sub">Level 1</div>
      </div>
    </div>
    <div class="topbar-right">
      <select id="lang-select" class="lang-select">
        <option value="de">DE 🇩🇪</option>
        <option value="en">EN 🇬🇧</option>
        <option value="ru">RU 🇷🇺</option>
      </select>
      <div class="topbar-pill">🪙 <span id="topbar-coins">0</span></div>
    </div>
  </div>

  <main class="view" id="view-play"></main>
  <main class="view" id="view-ranking" hidden></main>
  <main class="view" id="view-profile" hidden></main>
</div>

<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-btn active" data-view="play"><span class="nav-icon">🎯</span>Play</button>
    <button class="nav-btn" data-view="ranking"><span class="nav-icon">🏆</span>Ranking</button>
    <button class="nav-btn" data-view="profile"><span class="nav-icon">👤</span>Profile</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   0. TELEGRAM WEBAPP SETUP
   ========================================================= */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); } catch(e){}
}
function getTelegramUser(){
  try{
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      return {
        id: String(u.id),
        name: u.first_name || u.username || "Spieler",
        username: u.username || null
      };
    }
  }catch(e){}
  return { id: "guest", name: "Spieler", username: null };
}

/* =========================================================
   1. STORAGE KEYS & HELPERS
   ========================================================= */
const LS_PLAYER = "dropzonePlayer";
const LS_DAILY  = "dropzoneDaily";
const LS_BADGES = "dropzoneBadges";
const LS_STATS  = "dropzoneStats";
const LS_LANG   = "dropzoneLang";

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed == null ? fallback : parsed;
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function todayStr(){ return new Date().toLocaleDateString("sv-SE"); }
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toLocaleDateString("sv-SE");
}
function daysBetween(a, b){
  const da = new Date(a + "T00:00:00");
  const db = new Date(b + "T00:00:00");
  return Math.round((db - da) / 86400000);
}
function seededIndex(seedStr, arrLen){
  let h = 5381;
  for (let i=0; i<seedStr.length; i++){
    h = ((h << 5) + h) + seedStr.charCodeAt(i);
    h = h & 0xffffffff;
  }
  h = Math.abs(h);
  return arrLen > 0 ? h % arrLen : 0;
}

/* =========================================================
   2. CATEGORIES & FALLBACK QUESTIONS
   ========================================================= */
const CATEGORIES = [
  { key:"wissen",   label:"Wissen",        icon:"🧠", xp:20, coins:10 },
  { key:"gaming",   label:"Gaming",        icon:"🎮", xp:20, coins:10 },
  { key:"facts",    label:"Random Facts",  icon:"🌍", xp:25, coins:15 },
  { key:"reaktion", label:"Reaktion",      icon:"⚡", xp:25, coins:15 },
  { key:"logik",    label:"Logik",         icon:"🧩", xp:30, coins:20 }
];

const FALLBACK_QUESTIONS = {
  wissen: [{ q:"Wie viele Kontinente gibt es?", a:["5","6","7","8"], c:2 }],
  gaming: [{ q:"Welche Plattform gehört zu Valve?", a:["Steam","Epic Games","Roblox","Discord"], c:0 }],
  facts: [{ q:"Wie viele Herzen hat ein Oktopus?", a:["1","2","3","4"], c:2 }],
  reaktion: [{ q:"Welche Ampelfarbe bedeutet 'Stopp'?", a:["Grün","Gelb","Rot","Blau"], c:2 }],
  logik: [{ q:"Was folgt in der Reihe: 2, 4, 8, 16, ?", a:["18","24","32","20"], c:2 }]
};

let currentLang = localStorage.getItem(LS_LANG) || "de";
let currentQuestionBank = FALLBACK_QUESTIONS;

/* =========================================================
   3. BADGES & STATE
   ========================================================= */
const BADGE_DEFS = [
  { id:"first_drop",   icon:"🏅", title:"First Drop",    desc:"Erste Challenge abgeschlossen.", check:(s)=> s.totalChallenges >= 1 },
  { id:"streak7",       icon:"🔥", title:"7 Day Streak",  desc:"7 Tage hintereinander gespielt.", check:(s)=> s.bestStreak >= 7 },
  { id:"quiz_master",   icon:"🧠", title:"Quiz Master",   desc:"50 Challenges abgeschlossen.", check:(s)=> s.totalChallenges >= 50 },
  { id:"perfect_day",   icon:"⚡", title:"Perfect Day",   desc:"Alle 5 Daily Challenges an einem Tag.", check:(s)=> s.perfectDays >= 1 },
  { id:"veteran",       icon:"🏆", title:"Veteran",       desc:"100 Challenges abgeschlossen.", check:(s)=> s.totalChallenges >= 100 },
  { id:"coin_collector",icon:"💰", title:"Coin Collector",desc:"1000 Coins gesammelt.", check:(s)=> s.totalCoinsEarned >= 1000 }
];

let player, daily, badges, stats;

function defaultPlayer(){
  const tu = getTelegramUser();
  return { id: tu.id, name: tu.name, username: tu.username, xp:0, coins:0, streak:0, bestStreak:0, lastPlayDate:null };
}
function defaultStats(){
  return { totalChallenges:0, correctAnswers:0, wrongAnswers:0, totalXPEarned:0, totalCoinsEarned:0, bestStreak:0, perfectDays:0 };
}
function defaultBadges(){ return { unlocked:[] }; }

function generateDailyChallenges(dateStr){
  return CATEGORIES.map(cat=>{
    const bank = currentQuestionBank[cat.key] || FALLBACK_QUESTIONS[cat.key] || FALLBACK_QUESTIONS.wissen;
    const idx = seededIndex(dateStr + "_" + cat.key, bank.length);
    const item = bank[idx] || bank[0];
    return {
      category: cat.key,
      catLabel: cat.label,
      catIcon: cat.icon,
      question: item.q,
      answers: item.a,
      correctIndex: item.c,
      xp: cat.xp,
      coins: cat.coins,
      completed: false,
      wasCorrect: null
    };
  });
}

async function loadLanguageQuestions(langCode){
  try {
    const res = await fetch(`questions/${langCode}.json`);
    if (res.ok) {
      currentQuestionBank = await res.json();
    } else {
      currentQuestionBank = FALLBACK_QUESTIONS;
    }
  } catch(e) {
    currentQuestionBank = FALLBACK_QUESTIONS;
  }

  const today = todayStr();
  if (!daily || daily.date !== today) {
    daily = { date: today, challenges: generateDailyChallenges(today), bonusClaimed:false };
  } else {
    // Wenn am selben Tag die Sprache gewechselt wird: Texte der nicht gelösten Aufgaben updaten
    const fresh = generateDailyChallenges(today);
    daily.challenges.forEach((ch, i) => {
      if (!ch.completed && fresh[i]) {
        ch.question = fresh[i].question;
        ch.answers = fresh[i].answers;
        ch.correctIndex = fresh[i].correctIndex;
      }
    });
  }

  saveAll();
  renderAll();
}

function loadState(){
  player = loadJSON(LS_PLAYER, null) || defaultPlayer();
  stats  = loadJSON(LS_STATS, null) || defaultStats();
  badges = loadJSON(LS_BADGES, null) || defaultBadges();
  daily  = loadJSON(LS_DAILY, null);

  const tu = getTelegramUser();
  if (tu.id !== "guest") {
    player.id = tu.id;
    player.name = tu.name;
    player.username = tu.username;
  }

  const today = todayStr();
  if (player.lastPlayDate && player.lastPlayDate !== today) {
    const gap = daysBetween(player.lastPlayDate, today);
    if (gap > 1) player.streak = 0;
  }

  saveAll();
}

function saveAll(){
  saveJSON(LS_PLAYER, player);
  saveJSON(LS_DAILY, daily);
  saveJSON(LS_BADGES, badges);
  saveJSON(LS_STATS, stats);
  localStorage.setItem(LS_LANG, currentLang);
}

/* =========================================================
   4. LEVEL & GAME ACTIONS
   ========================================================= */
function getLevel(xp){ return Math.floor(xp/100) + 1; }
function levelFloor(level){ return (level-1)*100; }
function levelCeil(level){ return level*100; }

function answerChallenge(index, answerIdx){
  const ch = daily.challenges[index];
  if (!ch || ch.completed) return;

  const correct = answerIdx === ch.correctIndex;
  ch.completed = true;
  ch.wasCorrect = correct;
  ch.selected = answerIdx;

  stats.totalChallenges += 1;
  if (correct){
    stats.correctAnswers += 1;
    player.xp += ch.xp;
    player.coins += ch.coins;
    stats.totalXPEarned += ch.xp;
    stats.totalCoinsEarned += ch.coins;
    showToast("+" + ch.xp + " XP · +" + ch.coins + " 🪙");
  } else {
    stats.wrongAnswers += 1;
    showToast("Falsch!");
  }

  const today = todayStr();
  if (player.lastPlayDate !== today) {
    player.streak = (player.lastPlayDate === yesterdayStr()) ? player.streak + 1 : 1;
    player.lastPlayDate = today;
    if (player.streak > player.bestStreak) player.bestStreak = player.streak;
    if (player.streak > stats.bestStreak) stats.bestStreak = player.streak;
  }

  updateBadges();
  saveAll();
  renderAll();
}

function claimDailyBonus(){
  if (daily.bonusClaimed) return;
  const allDone = daily.challenges.every(c=>c.completed);
  if (!allDone) return;
  player.xp += 50;
  player.coins += 50;
  stats.totalXPEarned += 50;
  stats.totalCoinsEarned += 50;
  stats.perfectDays += 1;
  daily.bonusClaimed = true;
  updateBadges();
  saveAll();
  showToast("🎁 Bonus: +50 XP · +50 🪙");
  renderAll();
}

function updateBadges(){
  BADGE_DEFS.forEach(b=>{
    if (!badges.unlocked.includes(b.id) && b.check(stats)) {
      badges.unlocked.push(b.id);
    }
  });
}

function getRankingData(){
  const demoPlayers = [
    { name:"Shadow", level:15, xp:1420, demo:true },
    { name:"Nova",   level:13, xp:1280, demo:true },
    { name:"Pixel",  level:11, xp:1050, demo:true },
    { name:"Rex",    level:9,  xp:890,  demo:true }
  ];
  const me = { name: player.name || "Du", level:getLevel(player.xp), xp:player.xp, demo:false, isMe:true };
  const all = demoPlayers.concat([me]);
  all.sort((a,b)=> b.xp - a.xp);
  return all;
}

/* =========================================================
   5. RENDERING
   ========================================================= */
let openChallengeIndex = null;

function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function initials(name){
  if (!name) return "?";
  return name.trim().charAt(0).toUpperCase();
}

function showToast(msg){
  const wrap = document.getElementById("toast-wrap");
  const t = el(`<div class="toast">${msg}</div>`);
  wrap.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2100);
}

function renderTopbar(){
  document.getElementById("topbar-avatar").textContent = initials(player.name);
  document.getElementById("topbar-name").textContent = player.name || "Spieler";
  document.getElementById("topbar-sub").textContent = "Level " + getLevel(player.xp);
  document.getElementById("topbar-coins").textContent = player.coins;
  
  const langSelect = document.getElementById("lang-select");
  if (langSelect) langSelect.value = currentLang;
}

function renderPlay(){
  const root = document.getElementById("view-play");
  const completedCount = daily.challenges.filter(c=>c.completed).length;
  const pct = Math.round((completedCount/5)*100);
  const allDone = completedCount === 5;

  let html = `
    <div class="daily-card">
      <div class="daily-card-top">
        <div class="daily-card-title">🎯 Daily Challenge</div>
        <div class="daily-card-count">${completedCount} / 5</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="bonus-card ${daily.bonusClaimed ? 'claimed':''}">
      <div class="bonus-icon">🎁</div>
      <div class="bonus-texts">
        <div class="bonus-title">Daily Bonus</div>
        <div class="bonus-sub">${daily.bonusClaimed ? 'Heute bereits abgeholt' : '+50 XP · +50 Coins für alle 5 Challenges'}</div>
      </div>
      <button class="bonus-btn" id="bonus-btn" ${(!allDone || daily.bonusClaimed) ? 'disabled':''}>
        ${daily.bonusClaimed ? 'Erhalten' : 'Holen'}
      </button>
    </div>

    <div class="section-title">Heutige Challenges</div>
    <div id="challenge-list"></div>

    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val">🔥 ${player.streak}</div><div class="mini-stat-label">Streak</div></div>
      <div class="mini-stat"><div class="mini-stat-val">🪙 ${player.coins}</div><div class="mini-stat-label">Coins</div></div>
      <div class="mini-stat"><div class="mini-stat-val">${badges.unlocked.length}/${BADGE_DEFS.length}</div><div class="mini-stat-label">Badges</div></div>
    </div>
  `;
  root.innerHTML = html;

  const list = document.getElementById("challenge-list");
  daily.challenges.forEach((ch, idx)=>{
    const isOpen = openChallengeIndex === idx;
    const card = el(`
      <div class="challenge-card ${ch.completed ? 'done':''}">
        <div class="challenge-head" data-idx="${idx}">
          <div class="challenge-icon ${ch.completed?'done':''}">${ch.catIcon}</div>
          <div class="challenge-info">
            <div class="challenge-cat">${ch.catLabel}</div>
            <div class="challenge-q">${ch.question}</div>
            <div class="challenge-reward">+${ch.xp} XP · +${ch.coins} 🪙</div>
          </div>
          ${ch.completed
            ? `<div class="challenge-check">${ch.wasCorrect ? '✅' : '❌'}</div>`
            : `<div class="challenge-chevron ${isOpen?'open':''}">›</div>`
          }
        </div>
        <div class="answers ${isOpen && !ch.completed ? 'open':''}" id="answers-${idx}"></div>
      </div>
    `);
    list.appendChild(card);

    if (!ch.completed){
      card.querySelector(".challenge-head").addEventListener("click", ()=>{
        openChallengeIndex = (openChallengeIndex === idx) ? null : idx;
        renderPlay();
      });
    }

    if (isOpen && !ch.completed){
      const answersWrap = card.querySelector(`#answers-${idx}`);
      ch.answers.forEach((ansText, aIdx)=>{
        const btn = el(`<button class="answer-btn">${ansText}</button>`);
        btn.addEventListener("click", ()=> answerChallenge(idx, aIdx));
        answersWrap.appendChild(btn);
      });
    }
  });

  const bonusBtn = document.getElementById("bonus-btn");
  if (bonusBtn) bonusBtn.addEventListener("click", claimDailyBonus);
}

function renderRanking(){
  const root = document.getElementById("view-ranking");
  const data = getRankingData();
  const medals = ["🥇","🥈","🥉"];

  let html = `
    <div class="section-title" style="margin-top:16px;">🏆 Ranking</div>
    <div class="rank-note">Hinweis: Außer dir sind dies Demo-Spieler — es gibt noch kein Live-Backend.</div>
  `;
  root.innerHTML = html;

  const wrap = document.createElement("div");
  data.forEach((p, i)=>{
    const row = el(`
      <div class="rank-row ${p.isMe ? 'me':''}">
        <div class="rank-pos">${i < 3 ? `<span class="rank-medal">${medals[i]}</span>` : (i+1)}</div>
        <div class="rank-avatar">${initials(p.name)}</div>
        <div class="rank-info">
          <div class="rank-name">${p.isMe ? 'DU · ' + p.name : p.name}</div>
          <div class="rank-sub">Level ${p.level}${p.demo ? ' · Demo' : ''}</div>
        </div>
        <div class="rank-xp">${p.xp} XP</div>
      </div>
    `);
    wrap.appendChild(row);
  });
  root.appendChild(wrap);
}

function renderProfile(){
  const root = document.getElementById("view-profile");
  const level = getLevel(player.xp);
  const floor = levelFloor(level);
  const ceil = levelCeil(level);
  const pct = Math.min(100, Math.round(((player.xp-floor)/(ceil-floor))*100));

  let html = `
    <div class="profile-header">
      <div class="avatar-lg">${initials(player.name)}</div>
      <div class="profile-name">${player.name || "Spieler"}</div>
      <div class="profile-level">LEVEL ${level}</div>
      <div class="xp-box">
        <div class="xp-box-top"><span>${player.xp} XP</span><span>${ceil} XP</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-tile"><div class="stat-tile-icon">🪙</div><div class="stat-tile-val">${player.coins}</div><div class="stat-tile-label">Coins</div></div>
      <div class="stat-tile"><div class="stat-tile-icon">🔥</div><div class="stat-tile-val">${player.streak}</div><div class="stat-tile-label">Streak</div></div>
      <div class="stat-tile"><div class="stat-tile-icon">🎯</div><div class="stat-tile-val">${stats.totalChallenges}</div><div class="stat-tile-label">Challenges</div></div>
      <div class="stat-tile"><div class="stat-tile-icon">🏅</div><div class="stat-tile-val">${badges.unlocked.length}</div><div class="stat-tile-label">Badges</div></div>
    </div>

    <div class="section-title">My Badges</div>
    <div class="badge-grid" id="badge-grid"></div>

    <div class="section-title">Player Stats</div>
    <div class="playerstats-list">
      <div class="playerstats-row"><span class="playerstats-label">Total Challenges</span><span class="playerstats-val">${stats.totalChallenges}</span></div>
      <div class="playerstats-row"><span class="playerstats-label">Correct Answers</span><span class="playerstats-val">${stats.correctAnswers}</span></div>
      <div class="playerstats-row"><span class="playerstats-label">Wrong Answers</span><span class="playerstats-val">${stats.wrongAnswers}</span></div>
      <div class="playerstats-row"><span class="playerstats-label">Total XP</span><span class="playerstats-val">${stats.totalXPEarned}</span></div>
      <div class="playerstats-row"><span class="playerstats-label">Total Coins</span><span class="playerstats-val">${stats.totalCoinsEarned}</span></div>
      <div class="playerstats-row"><span class="playerstats-label">Best Streak</span><span class="playerstats-val">${stats.bestStreak}</span></div>
    </div>
  `;
  root.innerHTML = html;

  const grid = document.getElementById("badge-grid");
  BADGE_DEFS.forEach(b=>{
    const unlocked = badges.unlocked.includes(b.id);
    const tile = el(`
      <div class="badge-tile ${unlocked ? '' : 'locked'}">
        <div class="badge-icon">${b.icon}</div>
        <div class="badge-title">${b.title}</div>
        <div class="badge-desc">${b.desc}</div>
      </div>
    `);
    grid.appendChild(tile);
  });
}

function renderAll(){
  renderTopbar();
  renderPlay();
  renderRanking();
  renderProfile();
}

/* =========================================================
   6. NAVIGATION & INIT
   ========================================================= */
function switchView(name){
  ["play","ranking","profile"].forEach(v=>{
    document.getElementById("view-"+v).hidden = (v !== name);
  });
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.view === name);
  });
  if (tg && tg.HapticFeedback) { try{ tg.HapticFeedback.impactOccurred("light"); }catch(e){} }
}

document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click", ()=> switchView(btn.dataset.view));
});

document.addEventListener("DOMContentLoaded", () => {
  loadState();

  const langSelect = document.getElementById("lang-select");
  if (langSelect) {
    langSelect.value = currentLang;
    langSelect.addEventListener("change", (e) => {
      currentLang = e.target.value;
      loadLanguageQuestions(currentLang);
    });
  }

  loadLanguageQuestions(currentLang);
});

})();
</script>
</body>
</html>
