<script>
/* =========================================================
   1. CONFIG & BASE STATES
   ========================================================= */
const CATEGORIES = [
  { key:"wissen",   icon:"🧠", xp:20, coins:10 },
  { key:"gaming",   icon:"🎮", xp:20, coins:10 },
  { key:"facts",    icon:"🌍", xp:25, coins:15 },
  { key:"reaktion", icon:"⚡", xp:25, coins:15 },
  { key:"logik",    icon:"🧩", xp:30, coins:20 }
];

const TRANSLATIONS = {
  de: { title:"Dropzone Daily", streak:"Streak", coins:"Coins", level:"Lvl", completed:"Erledigt", solve:"Lösen", correct:"Richtig!", wrong:"Falsch!" },
  en: { title:"Dropzone Daily", streak:"Streak", coins:"Coins", level:"Lvl", completed:"Completed", solve:"Solve", correct:"Correct!", wrong:"Wrong!" },
  ru: { title:"Dropzone Daily", streak:"Стрик", coins:"Монеты", level:"Lvl", completed:"Готово", solve:"Решить", correct:"Верно!", wrong:"Неверно!" }
};

const FALLBACK_QUESTIONS = {
  wissen: [{ q:"Wie viele Kontinente gibt es?", a:["5","6","7","8"], c:2 }],
  gaming: [{ q:"Welche Plattform gehört zu Valve?", a:["Steam","Epic Games","Roblox","Discord"], c:0 }],
  facts: [{ q:"Wie viele Herzen hat ein Oktopus?", a:["1","2","3","4"], c:2 }],
  reaktion: [{ q:"Welche Ampelfarbe bedeutet 'Stopp'?", a:["Grün","Gelb","Rot","Blau"], c:2 }],
  logik: [{ q:"Was folgt in der Reihe: 2, 4, 8, 16, ?", a:["18","24","32","20"], c:2 }]
};

let currentLang = "de";
let currentQuestionBank = FALLBACK_QUESTIONS;

let user = {
  xp: 0,
  level: 1,
  coins: 0,
  streak: 0,
  lastPlayedDate: null
};

let daily = {
  date: todayStr(),
  challenges: []
};

/* =========================================================
   2. HELPER FUNCTIONS & STORAGE
   ========================================================= */
function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function seededIndex(seedStr, max) {
  let hash = 0;
  for (let i = 0; i < seedStr.length; i++) {
    hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
  }
  return Math.abs(hash) % max;
}

function loadAll() {
  const u = localStorage.getItem("dz_user");
  if (u) user = JSON.parse(u);

  const d = localStorage.getItem("dz_daily");
  if (d) {
    const parsed = JSON.parse(d);
    if (parsed.date === todayStr()) {
      daily = parsed;
    }
  }
}

function saveAll() {
  localStorage.setItem("dz_user", JSON.stringify(user));
  localStorage.setItem("dz_daily", JSON.stringify(daily));
}

function checkStreak() {
  const today = todayStr();
  if (!user.lastPlayedDate) return;

  const last = new Date(user.lastPlayedDate);
  const current = new Date(today);
  const diffDays = Math.round((current - last) / (1000 * 60 * 60 * 24));

  if (diffDays > 1) {
    user.streak = 0;
    saveAll();
  }
}

/* =========================================================
   3. QUESTION BANK & DYNAMIC LOADING
   ========================================================= */
async function loadLanguageQuestions(langCode) {
  try {
    const res = await fetch(`questions/${langCode}.json`);
    if (res.ok) {
      currentQuestionBank = await res.json();
    } else {
      currentQuestionBank = FALLBACK_QUESTIONS;
    }
  } catch(e) {
    currentQuestionBank = FALLBACK_QUESTIONS;
  }

  // Tagesaufgaben mit der neu geladenen Sprachdatei generieren/aktualisieren
  if (!daily.challenges || daily.challenges.length === 0 || daily.date !== todayStr()) {
    daily.date = todayStr();
    daily.challenges = generateDailyChallenges(todayStr());
  } else {
    // Fragen-Texte bei Sprachwechsel aktualisieren
    daily.challenges = generateDailyChallenges(todayStr());
  }

  saveAll();
  renderAll();
}

function generateDailyChallenges(dateStr) {
  return CATEGORIES.map(cat => {
    const bank = currentQuestionBank[cat.key] || FALLBACK_QUESTIONS[cat.key] || FALLBACK_QUESTIONS.wissen;
    const idx = seededIndex(dateStr + "_" + cat.key, bank.length);
    const item = bank[idx];
    
    return {
      category: cat.key,
      catIcon: cat.icon,
      question: item.q,
      answers: item.a,
      correctIndex: item.c,
      xp: cat.xp,
      coins: cat.coins,
      completed: false,
      wasCorrect: null
    };
  });
}

/* =========================================================
   4. GAME LOGIC & XP/LEVEL
   ========================================================= */
function addXP(amount) {
  user.xp += amount;
  const nextLvlXp = user.level * 100;
  if (user.xp >= nextLvlXp) {
    user.level++;
    user.xp -= nextLvlXp;
  }
}

function answerQuestion(catIndex, selectedIdx) {
  const ch = daily.challenges[catIndex];
  if (ch.completed) return;

  ch.completed = true;
  if (selectedIdx === ch.correctIndex) {
    ch.wasCorrect = true;
    addXP(ch.xp);
    user.coins += ch.coins;

    if (user.lastPlayedDate !== todayStr()) {
      user.streak++;
      user.lastPlayedDate = todayStr();
    }
  } else {
    ch.wasCorrect = false;
  }

  saveAll();
  renderAll();
}

/* =========================================================
   5. RENDER UI
   ========================================================= */
function renderAll() {
  const t = TRANSLATIONS[currentLang] || TRANSLATIONS.de;

  // Header / Stats
  document.getElementById("val-level").innerText = user.level;
  document.getElementById("val-xp").innerText = user.xp + " / " + (user.level * 100);
  document.getElementById("val-coins").innerText = user.coins;
  document.getElementById("val-streak").innerText = user.streak;

  // Challenge List
  const container = document.getElementById("challenges-list");
  if (!container) return;
  container.innerHTML = "";

  daily.challenges.forEach((ch, idx) => {
    const card = document.createElement("div");
    card.className = "card";

    let html = `
      <h3>${ch.catIcon} ${ch.category.toUpperCase()} (+${ch.xp} XP, +${ch.coins} Coins)</h3>
      <p><strong>${ch.question}</strong></p>
    `;

    if (ch.completed) {
      const statusText = ch.wasCorrect ? `✅ ${t.correct}` : `❌ ${t.wrong}`;
      html += `<p class="status">${statusText}</p>`;
    } else {
      html += `<div class="answers">`;
      ch.answers.forEach((ans, aIdx) => {
        html += `<button onclick="answerQuestion(${idx}, ${aIdx})">${ans}</button>`;
      });
      html += `</div>`;
    }

    card.innerHTML = html;
    container.appendChild(card);
  });
}

/* =========================================================
   6. INIT & EVENT LISTENERS
   ========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  loadAll();
  checkStreak();

  const langSelect = document.getElementById("lang-select");
  if (langSelect) {
    langSelect.value = currentLang;
    langSelect.addEventListener("change", (e) => {
      currentLang = e.target.value;
      loadLanguageQuestions(currentLang);
    });
  }

  // Erster Start mit ausgewählter Sprache
  loadLanguageQuestions(currentLang);
});
</script>
